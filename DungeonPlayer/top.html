  <h1>DungeonPlayer</h1>
  <p>AltomoSoft が制作したダンジョン探索RPG「DungeonPlayer」の紹介ページです。</p>
  <p>ダンジョンの構成は、探索する人間の性格やチーム編成の影響を受けて様々に姿を変えます。進行に応じて対象者に関わる重大な事象へ影響を及ぼし、やがて「神の試練」と「神の遺産」が設定され、それを受諾する権利が与えられます。ダンジョンが人へ授ける最終概念は「人の願い」を叶えることです。</p>
  <p>作中では次の5つの概念が、主人公アイン・ウォーレンスに問いを投げかけます。</p>
  <ul>
    <li>【自由】束縛するもの ブライヤード &lt;The Restrainer&gt;</li>
    <li>【希望】沈降せしもの ディープシー &lt;The Akashic&gt;</li>
    <li>【成長】凍てつくもの アゾルド &lt;The Desolate&gt;</li>
    <li>【困難】黙考せしもの ジード &lt;The Idea-Cage&gt;</li>
    <li>【真実】AlakhVes T Etula &lt;The End of the World&gt;</li>
  </ul>
